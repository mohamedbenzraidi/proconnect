version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: proconnect-postgres
    environment:
      POSTGRES_DB: proconnect_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: votre_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Optionnel : Si vous voulez un pgAdmin Web pour visualiser vos tables via navigateur
  pgadmin:
    image: dpage/pgadmin4
    container_name: proconnect-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@proconnect.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data: